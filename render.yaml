services:
  # -------------------------------------------------------
  # FastAPI Backend — free web service
  # -------------------------------------------------------
  - type: web
    name: notefusion-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # --- Auto-generated secrets ---
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET_KEY
        generateValue: true

      # --- Database (linked from below) ---
      - key: DATABASE_URL
        fromDatabase:
          name: notefusion-db
          property: connectionString

      # --- Redis (linked from below) ---
      - key: REDIS_URL
        fromService:
          type: redis
          name: notefusion-redis
          property: connectionString

      # --- CORS: allow Vercel frontend ---
      - key: BACKEND_CORS_ORIGINS
        value: "https://notefusion-ai.vercel.app,http://localhost:3000"

      # --- Google OAuth ---
      - key: GOOGLE_CLIENT_ID
        sync: false   # set manually in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # --- OpenAI ---
      - key: OPENAI_API_KEY
        sync: false

      # --- Stripe ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # --- Email ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

# -------------------------------------------------------
# PostgreSQL — free managed database
# -------------------------------------------------------
databases:
  - name: notefusion-db
    databaseName: notefusion
    user: notefusion_user
    plan: free
    region: oregon

# -------------------------------------------------------
# Redis — free cache
# -------------------------------------------------------
  - type: redis
    name: notefusion-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
