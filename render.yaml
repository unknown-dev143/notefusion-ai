services:
  # -------------------------------------------------------
  # FastAPI Backend — free web service on Render
  # -------------------------------------------------------
  - type: web
    name: notefusion-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # Auto-generated secrets
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET_KEY
        generateValue: true

      # Linked from the database below
      - key: DATABASE_URL
        fromDatabase:
          name: notefusion-db
          property: connectionString

      # Linked from Key Value (Redis-compatible) below
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: notefusion-redis
          property: connectionString

      # CORS: allow your Vercel frontend
      - key: BACKEND_CORS_ORIGINS
        value: "https://notefusion-ai.vercel.app,https://notefusion-frontend.vercel.app,http://localhost:3000"

      # Set these manually in the Render dashboard after first deploy
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # -------------------------------------------------------
  # Key Value (Redis-compatible) — free cache
  # Must live under services (not a top-level "caches" key)
  # -------------------------------------------------------
  - type: keyvalue
    name: notefusion-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # internal-only (required by Render)

# -------------------------------------------------------
# PostgreSQL — free managed database (expires after 30 days)
# -------------------------------------------------------
databases:
  - name: notefusion-db
    databaseName: notefusion
    user: notefusion_user
    plan: free
    region: oregon
