version: "3.8"

services:
  # -------------------------------------------------
  # PostgreSQL database
  # -------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: notefusion-db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notefusion}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # only accessible from this machine
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------
  # Redis cache / pub-sub broker
  # -------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: notefusion-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]   # no password needed locally
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------
  # Backend API (FastAPI)
  # -------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notefusion-api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Override host values so the API talks to the other containers
      POSTGRES_SERVER: db
      REDIS_HOST: redis
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-notefusion}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # only accessible from this machine
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s  # give the app time to start before checking

  # -------------------------------------------------
  # Frontend development server (Vite)
  # -------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notefusion-frontend
    env_file:
      - ./.env
    environment:
      VITE_BACKEND_HOST: api         # inside Docker, the API is "api"
      VITE_BACKEND_PORT: "8000"
      VITE_SOCKET_URL: ws://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -------------------------------------------------
  # Prometheus (metrics collector)
  # -------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: notefusion-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  # -------------------------------------------------
  # Grafana (dashboard UI for Prometheus)
  # -------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: notefusion-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"    # host port 3001 so it doesn't clash with the frontend
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
