version: "3.8"

# ============================================================
# NoteFusion AI - Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:
  # -------------------------------------------------
  # PostgreSQL database
  # -------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: notefusion-db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notefusion}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NOT exposed to host — only accessible inside Docker network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------
  # Redis cache / pub-sub broker
  # -------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: notefusion-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    # NOT exposed to host — only accessible inside Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------
  # Backend API (FastAPI) — production build
  # -------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: notefusion-api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_SERVER: db
      REDIS_HOST: redis
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-notefusion}"
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # only nginx forwards traffic in; never expose directly
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -------------------------------------------------
  # Frontend — built as static files served by Nginx
  # -------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: notefusion-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"   # nginx inside container serves on 80; Nginx reverse proxy forwards
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------
  # Prometheus (metrics collector)
  # -------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: notefusion-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"   # only accessible from host (via SSH tunnel)
    depends_on:
      api:
        condition: service_healthy

  # -------------------------------------------------
  # Grafana (dashboard UI for Prometheus)
  # -------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: notefusion-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"   # only accessible from host (via SSH tunnel)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:
